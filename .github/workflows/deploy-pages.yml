name: Deploy JARVIS prototype to GitHub Pages

on:
  push:
    branches:
      - arena/151a1a6d-jarvis-ai
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # The deployment action publishes the GitHub Pages artifact. Keeping this job
    # independent of the protected github-pages environment lets this feature branch
    # publish the preview without granting it access to other deployments.
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure Pages and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
